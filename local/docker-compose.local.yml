version: '3.8'

#==============================================================================
# OpenClaw 本地测试环境 - Docker Compose 配置
# 版本: V2.0（三层架构）
# 用途: 本地开发和测试
#==============================================================================

services:
  #----------------------------------------------------------------------------
  # Gateway 容器（Flask + openclaw 调度员）
  #----------------------------------------------------------------------------
  openclaw-gateway:
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile.gateway
    image: openclaw-gateway:local
    container_name: openclaw-gateway
    restart: unless-stopped

    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DB_PATH=/data/gateway.db
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_SECRET=${WECOM_SECRET:-}
      - WECOM_TOKEN=${WECOM_TOKEN:-}
      - WECOM_ENCODING_AES_KEY=${WECOM_ENCODING_AES_KEY:-}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-polling}
      - DISPATCHER_URL=${DISPATCHER_URL:-http://openclaw-local:18789}
      - AGENT_OPERATION_URL=${AGENT_OPERATION_URL:-http://openclaw-agent-operation:18789}
      - AGENT_PRODUCT_URL=${AGENT_PRODUCT_URL:-http://openclaw-agent-product:18789}
      - AGENT_DEVELOPMENT_URL=${AGENT_DEVELOPMENT_URL:-http://openclaw-agent-development:18789}
      - AGENT_TESTING_URL=${AGENT_TESTING_URL:-http://openclaw-agent-testing:18789}
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL:-http://openclaw-agent-service:18789}

    ports:
      - "8000:8000"

    volumes:
      - ../data/gateway:/data
      - ../logs/gateway:/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - openclaw-network

#------------------------------------------------------------------------------
# 网络配置
#------------------------------------------------------------------------------
networks:
  openclaw-network:
    external: true
    name: openclaw-network
