#==============================================================================
# OpenClaw 本地测试环境 - Docker Compose 配置
# 版本: V2.0（三层架构）
# 用途: 本地开发和测试（仅 agent 容器，Gateway 运行在宿主机）
#==============================================================================

# Gateway 已迁移到宿主机运行，此文件仅保留网络定义供 agent 容器使用。
# 启动 agent 容器请使用 config/docker-compose.agents.yml

#------------------------------------------------------------------------------
# 网络配置
#------------------------------------------------------------------------------
networks:
  openclaw-network:
    driver: bridge
    name: openclaw-network
