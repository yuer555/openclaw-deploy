version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: openclaw-nginx
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - openclaw-network
    depends_on:
      wecom-gateway:
        condition: service_healthy

  # 企业微信网关
  wecom-gateway:
    build: 
      context: ./wecom_gateway
      dockerfile: Dockerfile
    container_name: openclaw-wecom-gateway
    env_file:
      - .env
    environment:
      - DB_PATH=/data/user_roles.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs/wecom:/logs
    restart: unless-stopped
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  openclaw-network:
    driver: bridge
    name: openclaw-network
