version: '3.8'

services:
  # 运营虚拟员工
  operation-agent:
    image: openclaw-agent:v1.4
    container_name: operation-agent
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - NODE_ENV=production
      - AGENT_ID=operation
      - AGENT_NAME=运营助手
      - OPENCLAW_MODEL=github-copilot/claude-sonnet-4.5
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-me-please}
    volumes:
      - ./agents/operation:/workspace
      - ./data:/data
      - ./logs:/logs
    networks:
      - openclaw-network
    command: npx openclaw gateway --allow-unconfigured

  # 产品虚拟员工
  product-agent:
    image: openclaw-agent:v1.4
    container_name: product-agent
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - NODE_ENV=production
      - AGENT_ID=product
      - AGENT_NAME=产品经理
      - OPENCLAW_MODEL=github-copilot/claude-sonnet-4.5
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-me-please}
    volumes:
      - ./agents/product:/workspace
      - ./data:/data
      - ./logs:/logs
    networks:
      - openclaw-network
    command: npx openclaw gateway --allow-unconfigured

  # 研发虚拟员工
  development-agent:
    image: openclaw-agent:v1.4
    container_name: development-agent
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - NODE_ENV=production
      - AGENT_ID=development
      - AGENT_NAME=开发工程师
      - OPENCLAW_MODEL=github-copilot/claude-sonnet-4.5
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-me-please}
    volumes:
      - ./agents/development:/workspace
      - ./data:/data
      - ./logs:/logs
    networks:
      - openclaw-network
    command: npx openclaw gateway --allow-unconfigured

  # 测试虚拟员工
  testing-agent:
    image: openclaw-agent:v1.4
    container_name: testing-agent
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - NODE_ENV=production
      - AGENT_ID=testing
      - AGENT_NAME=测试工程师
      - OPENCLAW_MODEL=github-copilot/claude-sonnet-4.5
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-me-please}
    volumes:
      - ./agents/testing:/workspace
      - ./data:/data
      - ./logs:/logs
    networks:
      - openclaw-network
    command: npx openclaw gateway --allow-unconfigured

networks:
  openclaw-network:
    driver: bridge
