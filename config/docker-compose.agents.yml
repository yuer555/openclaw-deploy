version: '3.8'

#==============================================================================
# OpenClaw 虚拟员工容器配置
# 版本: V2.0（三层架构）
# 每个员工独立容器，各自运行 openclaw，预置角色性格
#==============================================================================

services:
  openclaw-agent-operation:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: operation
    image: openclaw-agent-operation:local
    container_name: openclaw-agent-operation
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "18791:18789"
    volumes:
      - ../data/agents/operation:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-network

  openclaw-agent-product:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: product
    image: openclaw-agent-product:local
    container_name: openclaw-agent-product
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "18792:18789"
    volumes:
      - ../data/agents/product:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-network

  openclaw-agent-development:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: development
    image: openclaw-agent-development:local
    container_name: openclaw-agent-development
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "18793:18789"
    volumes:
      - ../data/agents/development:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-network

  openclaw-agent-testing:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: testing
    image: openclaw-agent-testing:local
    container_name: openclaw-agent-testing
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "18794:18789"
    volumes:
      - ../data/agents/testing:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-network

  openclaw-agent-service:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: service
    image: openclaw-agent-service:local
    container_name: openclaw-agent-service
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "18795:18789"
    volumes:
      - ../data/agents/service:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-network

#------------------------------------------------------------------------------
# 网络配置（与 gateway 共享）
#------------------------------------------------------------------------------
networks:
  openclaw-network:
    external: true
    name: openclaw-network
