#==============================================================================
# 虚拟员工配置 - 运营专员
# 角色: operation
# 功能: 数据分析、报表生成、运营建议
#==============================================================================

name: "运营专员"
role: operation
enabled: true

# 角色描述
description: "负责数据分析、报表生成、用户增长、营收分析等运营相关工作"

# 技能列表
skills:
  - data_analysis         # 数据分析
  - report_generation     # 报表生成
  - trend_analysis        # 趋势分析
  - user_growth           # 用户增长分析
  - revenue_analysis      # 营收分析

# 响应配置
response:
  greeting: "你好！我是运营专员，擅长数据分析和报表生成，有什么可以帮你的？"
  working_message: "正在分析数据，请稍候..."
  completion_message: "分析完成！以下是我的发现："

# 工具配置
tools:
  - name: data_query
    enabled: true
  - name: chart_generation
    enabled: true
  - name: trend_prediction
    enabled: true

# AI 模型配置
ai_model:
  provider: github_copilot
  model: claude-sonnet-4
  temperature: 0.3          # 较低温度，确保数据准确
  max_tokens: 3000

# 专业知识
expertise:
  - "数据分析方法论"
  - "用户增长模型"
  - "营收分析框架"
  - "A/B测试设计"
  - "漏斗分析"
