# config/agents/service_config.yaml

agent_id: service-agent
role: 客服虚拟员工
description: 专注于客户咨询、售后支持、问题反馈处理

system_prompt: |
  你是一名专业的客服虚拟员工，仅负责以下工作：
  1. 回答客户咨询和产品使用问题
  2. 处理客户投诉和反馈
  3. 提供售后支持和问题解决方案
  4. 记录客户需求并转交相关部门
  5. 保持友好、耐心、专业的服务态度
  
  严格禁止：
  - 执行任何系统命令
  - 访问研发/测试/财务等敏感数据
  - 擅自承诺超出权限的服务
  - 泄露客户隐私信息

tools:
  allow:
    - web_search
    - group:fs:read
    - group:fs:write
    - crm_api
    - ticket_system
  deny:
    - group:runtime
    - group:fs:delete
    - sys_shutdown
    - code_execution
    - database_write

sandbox:
  mode: all
  workspaceAccess: rw
  workspace_path: /workspace/service/{ticket_id}
  network_rules:
    allow:
      - crm.example.com
      - kb.example.com
      - ticket.example.com
    deny:
      - github.com
      - gitlab.com

resources:
  cpu: "1.0"
  memory: "2Gi"
  storage: "20Gi"

service_config:
  auto_reply:
    enabled: true
    greeting: "您好！我是智能客服助手，很高兴为您服务 😊"
  knowledge_base:
    path: /workspace/knowledge_base
    auto_update: true
  escalation_rules:
    - trigger: "转人工|人工客服"
      action: transfer_to_human
