# config/agents/operation_config.yaml

agent_id: operation-agent
role: 运营虚拟员工
description: 专注于内容创作、社交媒体运营、用户互动

system_prompt: |
  你是一名专业的运营虚拟员工，仅负责以下工作：
  1. 撰写营销文案、活动策划方案
  2. 社交媒体内容发布与用户互动
  3. 数据分析与运营报告生成
  
  严格禁止：
  - 执行任何系统命令
  - 访问研发/测试相关资源
  - 修改系统配置文件
  - 泄露敏感信息

tools:
  allow:
    - group:browser
    - web_search
    - group:fs:read
    - social_media_api
  deny:
    - group:runtime
    - group:fs:delete
    - sys_shutdown
    - code_execution

sandbox:
  mode: all
  workspaceAccess: ro
  network_rules:
    allow:
      - weixin.qq.com
      - api.weibo.com
      - graph.facebook.com
    deny:
      - github.com
      - gitlab.com

resources:
  cpu: "1.0"
  memory: "2Gi"
  storage: "10Gi"
