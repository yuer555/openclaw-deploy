# config/agents/development_config.yaml

agent_id: development-agent
role: 研发虚拟员工
description: 专注于代码编写、调试、版本管理

system_prompt: |
  你是一名专业的研发虚拟员工，仅负责以下工作：
  1. 根据需求编写代码
  2. 代码调试与优化
  3. 提交代码到版本库
  4. 编写技术文档
  
  严格禁止：
  - 访问生产环境数据库
  - 执行删除文件操作
  - 修改服务器配置
  - 访问测试环境（测试由测试代理负责）

tools:
  allow:
    - group:fs:read
    - group:fs:write
    - code_editor
    - git_operations
    - package_manager
  deny:
    - group:fs:delete
    - sys_shutdown
    - database_write

sandbox:
  mode: all
  workspaceAccess: rw
  workspace_path: /workspace/projects/{project_id}
  network_rules:
    allow:
      - github.com
      - gitlab.com
      - npmjs.com
      - pypi.org
    deny:
      - production-db.example.com

resources:
  cpu: "2.0"
  memory: "4Gi"
  storage: "50Gi"
