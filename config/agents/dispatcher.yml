#==============================================================================
# 虚拟员工配置 - 调度员
# 角色: dispatcher
# 功能: 智能任务分发和路由
#==============================================================================

name: "智能调度员"
role: dispatcher
enabled: true

# 角色描述
description: "负责接收用户请求，分析任务类型，并智能分发给合适的虚拟员工"

# 能力配置
capabilities:
  - task_routing          # 任务路由
  - intent_recognition    # 意图识别
  - priority_management   # 优先级管理
  - load_balancing       # 负载均衡

# 路由规则
routing_rules:
  # 运营相关
  - keywords: ["数据", "报表", "分析", "统计", "营收", "用户量"]
    target: operation
    priority: high
  
  # 产品相关
  - keywords: ["需求", "功能", "产品", "设计", "原型", "交互"]
    target: product
    priority: high
  
  # 开发相关
  - keywords: ["代码", "bug", "开发", "接口", "API", "技术"]
    target: development
    priority: high
  
  # 测试相关
  - keywords: ["测试", "质量", "验收", "回归", "用例"]
    target: testing
    priority: medium
  
  # 客服相关
  - keywords: ["客户", "投诉", "咨询", "问题", "反馈"]
    target: service
    priority: high

# 响应配置
response:
  greeting: "你好！我是智能调度员，我会帮你找到最合适的同事来处理你的需求。"
  routing_message: "正在为你转接 {agent_name}..."
  fallback: "抱歉，我暂时无法理解你的需求，请描述得更详细一些。"

# AI 模型配置
ai_model:
  provider: github_copilot    # 或 openai
  model: claude-sonnet-4      # 或 gpt-4
  temperature: 0.7
  max_tokens: 2000

# 日志配置
logging:
  level: info
  include_context: true
