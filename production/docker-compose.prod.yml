version: '3.8'

#==============================================================================
# OpenClaw 生产环境 - Docker Compose 配置
# 版本: V2.0（三层架构）
# 用途: 生产部署，Docker 固定 IP，无 Nginx
# 子网: 172.20.0.0/16
#   gateway:     172.20.0.10:8000
#   operation:   172.20.0.11:18789
#   product:     172.20.0.12:18789
#   development: 172.20.0.13:18789
#   testing:     172.20.0.14:18789
#   service:     172.20.0.15:18789
#==============================================================================

services:
  #----------------------------------------------------------------------------
  # Gateway 容器（Flask + openclaw 调度员）
  #----------------------------------------------------------------------------
  openclaw-gateway:
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile.gateway
    image: openclaw-gateway:prod
    container_name: openclaw-gateway
    restart: always

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - DB_PATH=/data/gateway.db
      - WECOM_TOKEN=${WECOM_TOKEN:-}
      - WECOM_ENCODING_AES_KEY=${WECOM_ENCODING_AES_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-polling}
      - AGENT_OPERATION_URL=${AGENT_OPERATION_URL}
      - AGENT_PRODUCT_URL=${AGENT_PRODUCT_URL}
      - AGENT_DEVELOPMENT_URL=${AGENT_DEVELOPMENT_URL}
      - AGENT_TESTING_URL=${AGENT_TESTING_URL}
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL}

    ports:
      - "8000:8000"

    volumes:
      - /opt/openclaw/data/gateway:/data
      - /opt/openclaw/logs/gateway:/logs
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

    networks:
      openclaw-network:
        ipv4_address: 172.20.0.10

  #----------------------------------------------------------------------------
  # 虚拟员工容器
  #----------------------------------------------------------------------------
  openclaw-agent-operation:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: operation
    image: openclaw-agent-operation:prod
    container_name: openclaw-agent-operation
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/operation:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.11

  openclaw-agent-product:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: product
    image: openclaw-agent-product:prod
    container_name: openclaw-agent-product
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/product:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.12

  openclaw-agent-development:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: development
    image: openclaw-agent-development:prod
    container_name: openclaw-agent-development
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/development:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.13

  openclaw-agent-testing:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: testing
    image: openclaw-agent-testing:prod
    container_name: openclaw-agent-testing
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/testing:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.14

  openclaw-agent-service:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: service
    image: openclaw-agent-service:prod
    container_name: openclaw-agent-service
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/service:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.15

#------------------------------------------------------------------------------
# 网络配置（固定子网）
#------------------------------------------------------------------------------
networks:
  openclaw-network:
    driver: bridge
    name: openclaw-prod-net
    ipam:
      config:
        - subnet: 172.20.0.0/16
