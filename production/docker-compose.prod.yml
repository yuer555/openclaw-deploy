#==============================================================================
# OpenClaw 生产环境 - Docker Compose 配置
# 版本: V3.0（多 Agent 配置化部署）
# 用途: Agent 容器（Gateway 运行在宿主机）
#==============================================================================

services:
  #--- 虚拟员工容器 ---
  openclaw-agent-operation:
    image: openclaw-agent-operation:prod
    container_name: openclaw-agent-operation
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - MODEL_API=${MODEL_API:-openai-responses}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
      - OPENCLAW_TIMEOUT=${OPENCLAW_TIMEOUT:-2700}
      - CONTAINER_FILES_BASE=${CONTAINER_FILES_BASE:-/root/.openclaw/workspace/shared-files}
    ports:
      - "${AGENT_OPERATION_PORT:-18791}:18789"
    volumes:
      - /opt/openclaw/shared-files:/root/.openclaw/workspace/shared-files
    networks:
      openclaw-prod-net:
        ipv4_address: 172.20.0.11
    profiles:
      - operation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  openclaw-agent-product:
    image: openclaw-agent-product:prod
    container_name: openclaw-agent-product
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - MODEL_API=${MODEL_API:-openai-responses}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
      - OPENCLAW_TIMEOUT=${OPENCLAW_TIMEOUT:-2700}
      - CONTAINER_FILES_BASE=${CONTAINER_FILES_BASE:-/root/.openclaw/workspace/shared-files}
    ports:
      - "${AGENT_PRODUCT_PORT:-18792}:18789"
    volumes:
      - /opt/openclaw/shared-files:/root/.openclaw/workspace/shared-files
    networks:
      openclaw-prod-net:
        ipv4_address: 172.20.0.12
    profiles:
      - product
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  openclaw-agent-development:
    image: openclaw-agent-development:prod
    container_name: openclaw-agent-development
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - MODEL_API=${MODEL_API:-openai-responses}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
      - OPENCLAW_TIMEOUT=${OPENCLAW_TIMEOUT:-2700}
      - CONTAINER_FILES_BASE=${CONTAINER_FILES_BASE:-/root/.openclaw/workspace/shared-files}
    ports:
      - "${AGENT_DEVELOPMENT_PORT:-18793}:18789"
    volumes:
      - /opt/openclaw/shared-files:/root/.openclaw/workspace/shared-files
    networks:
      openclaw-prod-net:
        ipv4_address: 172.20.0.13
    profiles:
      - development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  openclaw-agent-testing:
    image: openclaw-agent-testing:prod
    container_name: openclaw-agent-testing
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - MODEL_API=${MODEL_API:-openai-responses}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
      - OPENCLAW_TIMEOUT=${OPENCLAW_TIMEOUT:-2700}
      - CONTAINER_FILES_BASE=${CONTAINER_FILES_BASE:-/root/.openclaw/workspace/shared-files}
    ports:
      - "${AGENT_TESTING_PORT:-18794}:18789"
    volumes:
      - /opt/openclaw/shared-files:/root/.openclaw/workspace/shared-files
    networks:
      openclaw-prod-net:
        ipv4_address: 172.20.0.14
    profiles:
      - testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  openclaw-agent-service:
    image: openclaw-agent-service:prod
    container_name: openclaw-agent-service
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-anthropic}
      - MODEL_API=${MODEL_API:-openai-responses}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
      - OPENCLAW_TIMEOUT=${OPENCLAW_TIMEOUT:-2700}
      - CONTAINER_FILES_BASE=${CONTAINER_FILES_BASE:-/root/.openclaw/workspace/shared-files}
    ports:
      - "${AGENT_SERVICE_PORT:-18795}:18789"
    volumes:
      - /opt/openclaw/shared-files:/root/.openclaw/workspace/shared-files
    networks:
      openclaw-prod-net:
        ipv4_address: 172.20.0.15
    profiles:
      - service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

networks:
  openclaw-prod-net:
    driver: bridge
    name: openclaw-prod-net
    ipam:
      config:
        - subnet: 172.20.0.0/24
