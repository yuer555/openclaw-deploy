#==============================================================================
# OpenClaw 生产环境 - Docker Compose 配置
# 版本: V2.0（三层架构）
# 用途: 生产部署，Docker 固定 IP，Gateway 运行在宿主机
# 子网: 172.20.0.0/16
#   gateway:     宿主机直接运行（:8000 + dispatcher :18789）
#   operation:   172.20.0.11:18789
#   product:     172.20.0.12:18789
#   development: 172.20.0.13:18789
#   testing:     172.20.0.14:18789
#   service:     172.20.0.15:18789
#==============================================================================

services:
  #----------------------------------------------------------------------------
  # Dispatcher 容器（AI 路由调度员）
  #----------------------------------------------------------------------------
  openclaw-dispatcher:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: dispatcher
    image: openclaw-dispatcher:prod
    container_name: openclaw-dispatcher
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-6}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    ports:
      - "18789:18789"
    volumes:
      - /opt/openclaw/data/dispatcher:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.10

  #----------------------------------------------------------------------------
  # 虚拟员工容器
  #----------------------------------------------------------------------------
  openclaw-agent-operation:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: operation
    image: openclaw-agent-operation:prod
    container_name: openclaw-agent-operation
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/operation:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.11

  openclaw-agent-product:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: product
    image: openclaw-agent-product:prod
    container_name: openclaw-agent-product
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/product:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.12

  openclaw-agent-development:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: development
    image: openclaw-agent-development:prod
    container_name: openclaw-agent-development
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/development:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.13

  openclaw-agent-testing:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: testing
    image: openclaw-agent-testing:prod
    container_name: openclaw-agent-testing
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/testing:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.14

  openclaw-agent-service:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
      args:
        ROLE: service
    image: openclaw-agent-service:prod
    container_name: openclaw-agent-service
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${API_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-claude-sonnet-4-20250514}
      - OPENCLAW_INTERNAL_TOKEN=${OPENCLAW_INTERNAL_TOKEN:-openclaw-internal-secret}
    expose:
      - "18789"
    volumes:
      - /opt/openclaw/data/agents/service:/workspace
      - /opt/openclaw/shared-files:/shared-files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      openclaw-network:
        ipv4_address: 172.20.0.15

#------------------------------------------------------------------------------
# 网络配置（固定子网）
#------------------------------------------------------------------------------
networks:
  openclaw-network:
    driver: bridge
    name: openclaw-prod-net
    ipam:
      config:
        - subnet: 172.20.0.0/16
